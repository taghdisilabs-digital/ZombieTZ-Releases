name: Rescue latest ZombieTZ full source and playable

on:
  push:
    paths:
      - ".github/workflows/rescue-latest-zombietz-20261004.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_URL: https://seeking-often-always-keno.trycloudflare.com
  FULL_SOURCE: ZombieTZ-FULL-SOURCE-levels1-10-20261004T172632Z.tar.zst
  FULL_SOURCE_SHA256: 4dfd71a1b68e1877629bd7f88f5f50a7f63e1fc318f492f9bcf5b903fbedc8e2
  SOURCE_OVERLAY: ZombieTZ-source-verified-20261004T1618Z.tar.zst
  PLAYABLE: ZombieTZ-Linux-verified-20261004T1620Z.tar.zst

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Pull exact latest full source
        run: |
          set -euxo pipefail
          curl --fail --location --retry 12 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 3000 -o "$FULL_SOURCE" "$BASE_URL/$FULL_SOURCE"
          echo "$FULL_SOURCE_SHA256  $FULL_SOURCE" | sha256sum -c -
          zstd -t "$FULL_SOURCE"
          sha256sum "$FULL_SOURCE" | tee FULL_SOURCE.sha256
      - name: Preserve exact latest full source
        uses: actions/upload-artifact@v4
        with:
          name: ZombieTZ-FULL-SOURCE-levels1-10-20261004T172632Z
          path: |
            ${{ env.FULL_SOURCE }}
            FULL_SOURCE.sha256
          compression-level: 0
          retention-days: 90
      - name: Pull latest compact source overlay
        run: |
          set -euxo pipefail
          curl --fail --location --retry 12 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 600 -o "$SOURCE_OVERLAY" "$BASE_URL/$SOURCE_OVERLAY"
          zstd -t "$SOURCE_OVERLAY"
          sha256sum "$SOURCE_OVERLAY" | tee SOURCE_OVERLAY.sha256
      - name: Preserve compact source overlay
        uses: actions/upload-artifact@v4
        with:
          name: ZombieTZ-source-verified-20261004T1618Z
          path: |
            ${{ env.SOURCE_OVERLAY }}
            SOURCE_OVERLAY.sha256
          compression-level: 0
          retention-days: 90
      - name: Pull latest verified playable
        run: |
          set -euxo pipefail
          curl --fail --location --retry 12 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 2400 -o "$PLAYABLE" "$BASE_URL/$PLAYABLE"
          zstd -t "$PLAYABLE"
          sha256sum "$PLAYABLE" | tee PLAYABLE.sha256
      - name: Preserve latest verified playable
        uses: actions/upload-artifact@v4
        with:
          name: ZombieTZ-Linux-verified-20261004T1620Z
          path: |
            ${{ env.PLAYABLE }}
            PLAYABLE.sha256
          compression-level: 0
          retention-days: 90
